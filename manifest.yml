modules:
  macro:
    - key: whiteboard
      resource: main
      resolver:
        function: resolver
      title: Whiteboard for Confluence
      description: This macro add a whiteboard to the confluence page. You need to
        publish this page to start drawing.
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/spa/build
    tunnel:
      port: 3000
permissions:
  external:
    fetch:
      backend:
        - '*.mixpanel.com'
      client:
        - '*.mixpanel.com'
    fonts:
      - 'https://fonts.googleapis.com/css2'
      - 'https://fonts.gstatic.com/'
    styles:
      - 'https://fonts.googleapis.com/css2'
      - 'https://fonts.gstatic.com/'
  content:
    styles:
      - 'unsafe-inline'
  scopes:
    - storage:app
app:
  id: ari:cloud:ecosystem::app/368b610d-bac1-4e2a-9311-6ec0adca5e49
  storage:
    entities:
      - name: whiteboard-state
        attributes:
          schemaVersion:
            type: integer
          revision:
            type: integer
          state:
            type: string
          currentToken:
            type: string
          expectedToken:
            type: string
          candidateToken:
            type: string
          writeId:
            type: string
          compressedJson:
            type: string
  runtime:
    name: nodejs22.x
