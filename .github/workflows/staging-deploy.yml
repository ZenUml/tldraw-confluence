name: Staging Deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Forge Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: forge-staging-tldraw
      cancel-in-progress: false
    environment:
      name: staging-tldraw
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact commit
        run: pnpm validate
        env:
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: unreleased
          VITE_ENVIRONMENT_TYPE: staging
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}

      - name: Verify current default-branch tip
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          HEAD_SHA=$(git rev-parse HEAD)
          TIP_SHA=$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}")
          if [ "$HEAD_SHA" != "$TIP_SHA" ]; then
            echo "This commit is no longer the ${DEFAULT_BRANCH} tip, so it is not deployed." >&2
            echo "  this run: $HEAD_SHA" >&2
            echo "  current tip: $TIP_SHA" >&2
            echo "A later merge superseded it. Read the run for the current tip instead." >&2
            echo "This is the guard working: staging only ever receives the tip." >&2
            exit 1
          fi

      # Forge reports a missing credential as an opaque "Not logged in". Fail here
      # instead, with a message that names the environment. This job's log is public,
      # so report presence only: never a value, a length, or a prefix.
      - name: Verify Forge credentials are present
        env:
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FORGE_EMAIL:-}" ]; then EMAIL_PRESENT=true; else EMAIL_PRESENT=false; fi
          if [ -n "${FORGE_API_TOKEN:-}" ]; then TOKEN_PRESENT=true; else TOKEN_PRESENT=false; fi
          echo "FORGE_EMAIL present: $EMAIL_PRESENT"
          echo "FORGE_API_TOKEN present: $TOKEN_PRESENT"
          if [ "$EMAIL_PRESENT" != true ] || [ "$TOKEN_PRESENT" != true ]; then
            echo "Forge credentials did not resolve." >&2
            echo "The email comes from the staging-tldraw environment variable." >&2
            echo "The token comes from the repository secret that the caller inherits," >&2
            echo "because a called workflow receives no environment secrets." >&2
            exit 1
          fi

      # Keep the repository build on Node 22.22.3. Only the Forge CLI switches
      # to Node 20, matching conf-app's workaround for intermittent node-fetch
      # "Premature close" failures while Forge fetches platform schemas.
      - name: Use Node 20 for Forge CLI (node-fetch "Premature close" workaround)
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: Deploy existing app to Forge staging
        shell: bash
        run: |
          pnpm forge:deploy:disable-analytics
          pnpm forge:lint:tldraw:staging
          pnpm forge:deploy:tldraw:staging
        env:
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Upload staging inputs
        uses: actions/upload-artifact@v6
        with:
          name: whiteboard-staging-${{ github.sha }}
          path: |
            manifest.yml
            static/spa/build
          if-no-files-found: error
          retention-days: 14
