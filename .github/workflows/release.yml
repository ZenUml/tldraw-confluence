name: Release

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  release:
    name: ${{ github.event.release.tag_name }} to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: forge-production-tldraw
      cancel-in-progress: false
    # The environment supplies the existing Forge production credential. It has no
    # reviewer gate; publishing the draft is the production authorization, matching
    # conf-app's release workflow.
    environment:
      name: production-tldraw
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: pnpm validate
        env:
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ github.event.release.tag_name }}
          VITE_ENVIRONMENT_TYPE: production
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}

      - name: Verify Forge credentials are present
        env:
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FORGE_EMAIL:-}" ]; then EMAIL_PRESENT=true; else EMAIL_PRESENT=false; fi
          if [ -n "${FORGE_API_TOKEN:-}" ]; then TOKEN_PRESENT=true; else TOKEN_PRESENT=false; fi
          echo "FORGE_EMAIL present: $EMAIL_PRESENT"
          echo "FORGE_API_TOKEN present: $TOKEN_PRESENT"
          if [ "$EMAIL_PRESENT" != true ] || [ "$TOKEN_PRESENT" != true ]; then
            echo "Forge production credentials did not resolve." >&2
            exit 1
          fi

      - name: Use Node 20 for Forge CLI (node-fetch "Premature close" workaround)
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"

      - name: Deploy existing app to Forge production
        shell: bash
        run: |
          pnpm forge:deploy:disable-analytics
          pnpm forge:lint:tldraw:prod
          pnpm forge:deploy:tldraw:prod
        env:
          FORGE_EMAIL: ${{ vars.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Upload production inputs
        uses: actions/upload-artifact@v7
        with:
          name: whiteboard-production-${{ github.event.release.tag_name }}
          path: |
            manifest.yml
            static/spa/build
          if-no-files-found: error
          retention-days: 30
