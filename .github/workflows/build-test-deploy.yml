name: Build, Test and Stage

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

  staging:
    name: Stage tested main commit
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    uses: ./.github/workflows/staging-deploy.yml
    # A called workflow receives no environment secrets. Evidence: main run
    # 33395382680 reported the Forge email variable present and the Forge API token
    # secret absent, from one job that declared `environment: staging-tldraw`. The
    # environment variable resolved; the environment secret did not. Only the caller
    # can supply it, and this job runs solely on a default-branch push, so the pull
    # request check stays credential-free.
    secrets: inherit
