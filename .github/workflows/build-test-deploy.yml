name: Build, Test and Stage

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# The push and pull_request events for one branch must not share a concurrency key.
# When they did, whichever run started second cancelled the other, `gh pr checks`
# reported the cancelled run as a failure, and `mergeStateStatus` stayed UNSTABLE for
# the life of every pull request. Keying on the event as well keeps one authoritative
# conclusion per event and still cancels superseded runs within the same event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate
        env:
          VITE_APP_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: unreleased
          VITE_ENVIRONMENT_TYPE: ci

  staging:
    name: Stage tested main commit
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    uses: ./.github/workflows/staging-deploy.yml
    # A called workflow receives no environment secrets. Evidence: main run
    # 33395382680 reported the Forge email variable present and the Forge API token
    # secret absent, from one job that declared `environment: staging-tldraw`. The
    # environment variable resolved; the environment secret did not. Only the caller
    # can supply it, and this job runs solely on a default-branch push, so the pull
    # request check stays credential-free.
    secrets: inherit

  draft-release:
    name: "Draft: Whiteboard"
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export release version
        shell: bash
        run: echo "version=$(date -u +'%Y.%m.%d%H%M')" >> "$GITHUB_ENV"

      - name: Create release draft
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.version }}-tldraw
          name: v${{ env.version }}-tldraw
          commit: ${{ github.sha }}
          body: "This is a draft release for the Whiteboard app."
          draft: true
