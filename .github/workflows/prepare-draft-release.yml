name: Prepare Draft Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA that passed the main staging run
        required: true
        type: string
      main_run_id:
        description: Successful Build, Test and Stage run ID for the same SHA
        required: true
        type: string
      ui_evidence_sha256:
        description: SHA-256 of UI evidence held in approved private storage
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  preflight:
    name: Verify staged SHA and private evidence hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.verify.outputs.commit_sha }}
      main_run_id: ${{ steps.verify.outputs.main_run_id }}
      evidence_hash: ${{ steps.verify.outputs.evidence_hash }}
    steps:
      - name: Verify main staging run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MAIN_RUN_ID: ${{ inputs.main_run_id }}
          EVIDENCE_HASH: ${{ inputs.ui_evidence_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase Git SHA" >&2
            exit 1
          fi
          if [[ ! "$MAIN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "main_run_id must be numeric" >&2
            exit 1
          fi
          if [[ ! "$EVIDENCE_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ui_evidence_sha256 must be a lowercase SHA-256" >&2
            exit 1
          fi

          gh run view "$MAIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,headBranch,headSha,jobs,workflowName \
            > "$RUNNER_TEMP/main-run.json"

          jq -e \
            --arg sha "$COMMIT_SHA" \
            --arg branch "$DEFAULT_BRANCH" \
            '.conclusion == "success"
             and .event == "push"
             and .headBranch == $branch
             and .headSha == $sha
             and .workflowName == "Build, Test and Stage"
             and any(.jobs[]; (.name | endswith("Deploy to Forge Staging")) and .conclusion == "success")' \
            "$RUNNER_TEMP/main-run.json" > /dev/null

          {
            echo "commit_sha=$COMMIT_SHA"
            echo "main_run_id=$MAIN_RUN_ID"
            echo "evidence_hash=$EVIDENCE_HASH"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: Create SHA-pinned draft
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment:
      name: staging-tldraw-release
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          MAIN_RUN_ID: ${{ needs.preflight.outputs.main_run_id }}
          EVIDENCE_HASH: ${{ needs.preflight.outputs.evidence_hash }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(date -u +'%Y.%m.%d%H%M')-tldraw"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Staging run ID: $MAIN_RUN_ID"
            echo "UI evidence SHA-256: $EVIDENCE_HASH"
          } > "$NOTES"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --draft
