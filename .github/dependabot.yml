version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    groups:
      routine-development-tools:
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "@forge/api"
          - "@forge/bridge"
          - "@forge/resolver"
          - "@forge/ui"
          - "@tldraw/tldraw"
          - autoprefixer
          - lzutf8
          - mixpanel-browser
          - postcss
          - react
          - react-dom
          - react-rnd
          - "@vitejs/plugin-react"
          - styled-components
          - tailwindcss
    ignore:
      - dependency-name: "@forge/api"
      - dependency-name: "@forge/bridge"
      - dependency-name: "@forge/resolver"
      - dependency-name: "@forge/ui"
      - dependency-name: "@tldraw/tldraw"
      - dependency-name: autoprefixer
      - dependency-name: lzutf8
      - dependency-name: mixpanel-browser
      - dependency-name: postcss
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-rnd
      - dependency-name: "@vitejs/plugin-react"
      - dependency-name: vite
      - dependency-name: styled-components
      - dependency-name: tailwindcss

  # The workflows pin four actions by major version. Without this block nothing ever
  # tells us a pinned major has a security fix. Dependabot's pull requests run the
  # same secretless `Build and Unit Test` check as any other, and the workflow contract
  # test rejects a bump that leaves an action on a moving ref.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Melbourne
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
